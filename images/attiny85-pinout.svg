<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="600" height="480" role="img" aria-labelledby="t d">
<title id="t">Pinout van de ATtiny85</title>
<desc id="d">Schema van de 8 pootjes van de ATtiny85 met per pootje het nummer op de chip, de pin in Tinkercad en wat de pin kan.</desc>
<rect width="600" height="480" fill="#ffffff"/>
<rect x="185" y="108" width="52" height="14" rx="2" fill="#777777"/>
<text x="173" y="113" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#777777">reset</text>
<text x="173" y="133" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#555">PB5 · niet gebruiken</text>
<rect x="185" y="183" width="52" height="14" rx="2" fill="#1d5fb4"/>
<text x="173" y="188" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1d5fb4">pin 3 · A3</text>
<text x="173" y="208" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#555">PB3 · analoge ingang</text>
<rect x="185" y="258" width="52" height="14" rx="2" fill="#1d5fb4"/>
<text x="173" y="263" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1d5fb4">pin 4 · A2</text>
<text x="173" y="283" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#555">PB4 · analoge ingang</text>
<rect x="185" y="333" width="52" height="14" rx="2" fill="#222222"/>
<text x="173" y="338" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#222222">GND</text>
<text x="173" y="358" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#555">naar de min</text>
<rect x="363" y="108" width="52" height="14" rx="2" fill="#b3261e"/>
<text x="427" y="113" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#b3261e">VCC</text>
<text x="427" y="133" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#555">5 V van de regelaar</text>
<rect x="363" y="183" width="52" height="14" rx="2" fill="#1d5fb4"/>
<text x="427" y="188" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1d5fb4">pin 2 · A1</text>
<text x="427" y="208" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#555">PB2 · analoge ingang</text>
<rect x="363" y="258" width="52" height="14" rx="2" fill="#c25a00"/>
<text x="427" y="263" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#c25a00">pin 1 · PWM</text>
<text x="427" y="283" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#555">PB1 · waarde 0 tot 255</text>
<rect x="363" y="333" width="52" height="14" rx="2" fill="#c25a00"/>
<text x="427" y="338" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#c25a00">pin 0 · PWM</text>
<text x="427" y="358" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#555">PB0 · waarde 0 tot 255</text>
<path d="M235,70 H284 A16,16 0 0 0 316,70 H365 V390 H235 Z" fill="#303744"/>
<circle cx="253" cy="90" r="5" fill="#ffffff" fill-opacity=".85"/>
