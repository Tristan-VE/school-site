<text x="337" y="347" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#ffffff">5</text>
<text x="300" y="238" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#ffffff" transform="rotate(-90 300 230)" letter-spacing="2">ATtiny85</text>
<text x="20" y="428" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#555">Witte cijfers: nummer van het pootje op de chip. Witte stip: pootje 1.</text>
<rect x="20" y="441" width="14" height="14" rx="2" fill="#c25a00"/>
<text x="40" y="453" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#333">PWM</text>
<rect x="120" y="441" width="14" height="14" rx="2" fill="#1d5fb4"/>
<text x="140" y="453" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#333">analoge ingang (meten)</text>
<rect x="330" y="441" width="14" height="14" rx="2" fill="#b3261e"/>
<text x="350" y="453" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#333">voeding (5 V)</text>
<rect x="20" y="463" width="14" height="14" rx="2" fill="#222222"/>
<text x="40" y="475" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#333">GND (min)</text>
<rect x="170" y="463" width="14" height="14" rx="2" fill="#777777"/>
<text x="190" y="475" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#333">reset</text>
